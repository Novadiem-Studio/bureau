# The bureau is 434 markdown files, 47 shell scripts and 36 JSON configs that
# agents read and execute. Nothing here compiles, so the failures that matter
# are the quiet ones: a workflow that stops being registered in the index, a
# model-routing JSON that stops parsing, a helper script with a syntax error
# that only shows up mid-run.
#
# check-framework.sh already catches the first class and has since it was
# written. It just never ran unless somebody remembered to run it. This makes
# it a gate.
#
# check-drift.sh is deliberately absent: it takes install paths as arguments
# and there are no per-project copies to compare against (retired 2026-06-13),
# so in CI it would check nothing and always pass.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes anything back: checkout, install, run checks. The repo
# default is already read-only, but declaring it means an org- or repo-level
# default changing later cannot silently widen this workflow's token.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    name: Diagnostic (issue 131)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe pid liveness tools
        run: |
          uname -a; head -2 /etc/os-release
          echo "ps=$(command -v ps)"; ps --version 2>&1 | head -1; dpkg -l procps 2>/dev/null | tail -1
          echo "sh=$(readlink -f /bin/sh)  bash=$(bash --version | head -1)  python3=$(python3 --version)"
          mount | grep ' /proc '
          sh -c 'sleep 5 & p=$!; ps -p $p >/dev/null 2>&1; echo "ps -p live child: rc=$?"; kill -0 $p 2>/dev/null; echo "kill -0 live child: rc=$?"; [ -d /proc/$p ]; echo "/proc live child: rc=$?"; python3 -c "import os,sys; os.kill($p,0)"; echo "python kill live child: rc=$?"; ps -p $p; wait'
          ps -p $$; echo "ps -p self: rc=$?"
          ps -p 999999 >/dev/null 2>&1; echo "ps -p dead: rc=$?"; kill -0 999999 2>/dev/null; echo "kill -0 dead: rc=$?"
          ps -p 1 >/dev/null 2>&1; echo "ps -p 1: rc=$?"; kill -0 1 2>/dev/null; echo "kill -0 1: rc=$?"
      - name: Run fixture 296 alone, three times, with the replays' stderr
        run: |
          export ROOT="$PWD"
          f=.bureau/regression/296-cursor-cold-reviewer-resume.md
          cmd=$(awk '/^command:[[:space:]]*\|[[:space:]]*$/ { blk = 1; next } blk == 1 { if ($0 ~ /^[[:space:]]/ || $0 == "") { sub(/^  /, ""); print; next } blk = 0 }' "$f")
          for i in 1 2 3; do echo "##### iteration $i"; sh -c "$cmd"; echo "##### iteration $i rc=$?"; done

  regression:
    name: Regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run all automated regression fixtures
        run: sh .bureau/regression/run.sh

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The framework's own mechanical lint: workflow registry, worktree docs,
      # the orchestrator.md line budget, name lint. Exit 0 = pass. It prints
      # WARN lines without failing, and those are worth reading in the log.
      - name: Framework lint
        run: ./check-framework.sh

      # A syntax error in a helper only surfaces when an agent runs it, which
      # can be deep into a run. `bash -n` parses without executing.
      - name: Shell scripts parse
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail

      # Model routing and policy live in JSON. Malformed config fails at
      # dispatch time, in the middle of a run, which is the worst place to
      # find out.
      - name: JSON configs parse
        run: |
          fail=0
          while IFS= read -r f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::invalid JSON"; fail=1; }
          done < <(git ls-files '*.json')
          exit $fail

      - name: YAML parses
        run: |
          fail=0
          while IFS= read -r f; do
            python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::invalid YAML"; fail=1; }
          done < <(git ls-files '*.yaml' '*.yml')
          exit $fail

      # No requirements.txt and no test suite for these, so compiling them is
      # the honest limit of what can be checked: it proves they parse on the
      # Python CI runs, nothing about whether they work.
      - name: Python scripts compile
        run: python3 -m compileall -q $(git ls-files '*.py')
